<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Mini Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <p>Welcome to my HTML5 practice project!</p>

    <!-- Simple SVG example -->
    <svg width="150" height="150">
      <circle cx="75" cy="75" r="50" fill="green" stroke="black" stroke-width="3" />
    </svg>
  </header>

  <section>
    <h2>My Skills Progress</h2>

    <p>HTML5 Learning Progress:</p>
    <progress value="40" max="100"></progress>

    <p>CSS Learning Progress:</p>
    <progress value="45" max="100"></progress>

    <p>JavaScript Learning Progress:</p>
    <progress value="40" max="100"></progress>
  </section>

  <section>
    <h2>Favorite Web Tool</h2>
    <label for="tools">Favorite Web Tool:</label>
    <input id="tools" type="text" list="webtools" placeholder="Choose or type a tool">
    <datalist id="webtools">
      <option value="Visual Studio Code">
      <option value="Sublime Text">
      <option value="Figma">
      <option value="GitHub">
    </datalist>
  </section>

  <section>
    <h2>Contact Me</h2>
    <form autocomplete="off">
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus>

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" placeholder="example@example.com" required>

      <label for="url">Portfolio Website:</label>
      <input type="url" id="url" name="url" placeholder="https://example.com">

      <label for="tel">Phone Number:</label>
      <input type="tel" id="tel" name="tel" placeholder="555-555-1211">

      <input type="submit" value="Send">
    </form>
  </section>

  <footer>
    <p>&copy; 2025 My Mini Portfolio</p>
  </footer>
</body>
</html>
